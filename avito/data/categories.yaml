# Схема полей Автозагрузки — СВЕРЕНО с официальными шаблонами Авито.
#
# Источник (в отличие от прошлой версии этого файла — она была черновиком по
# открытым гайдам и во многом врала, см. B-002 в docs/BACKLOG.md):
#   ~/Downloads/Мужская одежда - Кофты и футболки - Шаблон 02-08-2026.xlsx
#   + 39 XML-шаблонов оттуда же, скачаны заказчиком из ЛК 03.08.2026.
# Все значения ниже вынуты из листа «Справочники» и строки 3 листа
# «Объявления» этого шаблона, а не из головы.
#
# ВАЖНО, что этот файл покрывает ОДНУ категорию — «Мужская одежда → Кофты и
# футболки» (template id 100343). Она закрывает основную массу каталога
# (худи, футболки, свитеры, толстовки, поло). Для брюк/джинсов/шорт/костюмов
# и любой обуви нужны свои xlsx — у них другой набор тегов (см. open_questions).

verified: true
verified_at: "2026-08-03"
verified_by: "официальный шаблон Авито 02-08-2026, template id 100343"
source_note: "лист «Справочники» + строка 3 листа «Объявления» из xlsx-шаблона ЛК"

category_path: "Личные вещи - Одежда, обувь, аксессуары - Мужская одежда - Кофты и футболки"
template_id: 100343

# Обязательные поля, чьи допустимые значения из шаблона НЕ достаются:
# у Delivery в xlsx нет dataValidation (он «одно или несколько значений», а
# Excel не умеет мультиселект), а списка в «Справочниках» нет. Пока список
# непустой, require_verified() падает — то есть публиковать нельзя.
# Закрывается вручную: открыть шаблон в Excel, ткнуть в столбец Y «Способ
# доставки», выписать значения сюда и очистить этот список.
unresolved_required_fields:
  - Delivery

feed:
  root_tag: Ads
  root_attrs:
    formatVersion: "3"
    target: "Avito.ru"
  ad_tag: Ad
  # Подтверждено во всех 39 XML-шаблонах: <Images><Image url="..."/></Images>.
  # ImageUrls/ImageNames — это имена КОЛОНОК для xlsx/csv, а не теги XML.
  images_tag: Images
  image_item_tag: Image
  image_url_attr: url
  # «Чтобы объявление больше не публиковалось, удалите его из этого файла или
  # укажите для него параметр DateEnd» — лист «Инструкция», дословно.
  archive_tag: DateEnd

# Строка 3 листа «Объявления», значение «Обязательный».
required_tags:
  - Id
  - Title
  - Description
  - Category
  - Address
  - Images
  - Delivery
  - Price
  - GoodsType
  - Condition
  - AdType
  - Brand
  - Apparel
  - Size
  - GoodsSubType

# Поля, которые Авито помечает «Может быть обязательным» — зависят от других
# значений. Color нам нужен всегда, когда поставщик его дал.
conditionally_required_tags:
  - Color
  - ColorName

# Допустимые значения, дословно из «Справочников». Регистр, «ё» и неразрывные
# пробелы значимы — Авито сверяет строкой. В двух значениях AdType стоит
# именно NBSP (U+00A0), а не обычный пробел: так в шаблоне, и обычный пробел
# там сверку сломает. Символ лежит в файле как есть и глазами неотличим от
# пробела — при правке этих строк копируй их целиком, не перенабирай.
# Регресс на это: tests/test_categories.py.
