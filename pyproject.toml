[project]
name = "avito-dvijenia"
version = "0.1.0"
description = "Автоматизация выставления, ротации и затирки объявлений на Авито через Автозагрузку"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.21",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "apscheduler>=3.10",
    "aiogram>=3.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "gspread>=6.1",
    "google-auth>=2.30",
    "selectolax>=0.3",
    "pillow>=10.3",
    "imagehash>=4.3",
    "lxml>=5.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
avito-dvijenia = "cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = [
    "core*", "sources*", "media*", "content*", "avito*",
    "admin*", "lifecycle*", "messenger*", "scheduler*", "bot*", "web*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
