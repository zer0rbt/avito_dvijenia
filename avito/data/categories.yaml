# Наши постоянные значения для всех карточек. Condition — «Новое с биркой»:
# товар новый от поставщика. AdType — «приобретен на продажу», мы не
# производитель.
defaults:
  Category: "Одежда, обувь, аксессуары"
  GoodsType: "Мужская одежда"
  Apparel: "Кофты и футболки"
  Condition: "Новое с биркой"
  AdType: "Товар приобретен на продажу"

# Буквенная сетка поставщика -> строка Size Авито. Обе таблицы (Э1) отдают
# только буквы, поэтому маппинг однозначный. Неоднозначные значения Авито
# (44 (XS/S), 52 (L/XL), 58 (XXL), 70/74/80) намеренно НЕ используем —
# берём канонические однобуквенные.
size_map:
  XS: "42 (XS)"
  S: "46 (S)"
  M: "48 (M)"
  L: "50 (L)"
  XL: "54 (XL)"
  XXL: "56 (XXL)"
  XXXL: "60 (3XL)"

# Цвет у поставщика — свободный текст («Черные», «ЧЕРНЫЙ»), у Авито — строгий
# список. Ключи в нижнем регистре, сверка по вхождению основы слова.
color_map:
  черн: "Чёрный"
  белы: "Белый"
  бел: "Белый"
  красн: "Красный"
  син: "Синий"
